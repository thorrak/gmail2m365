# /etc/gmail2m365/alice.conf  (chmod 600)  -- one file per destination mailbox
M365_USER="alice@example.com"                                   # destination Microsoft 365 mailbox

# One or more Gmail / Google Workspace source inboxes. Format "address:/path/to/app-password-file".
# Several sources may fan into the same destination.
GMAIL_ACCOUNTS=(
  "alice@gmail.com:/etc/gmail2m365/gmail-alice.pw"
  # "alice.old@gmail.com:/etc/gmail2m365/gmail-alice-old.pw"
)

# 0 = delete each message from Gmail INBOX right after it is copied (POP-style, default).
# N = leave messages in Gmail INBOX for N days, then expunge them. Messages deleted on the
#     Microsoft side are never re-copied.
RETAIN_DAYS=0

# Optional Uptime Kuma (or similar) push/heartbeat URL, hit after every successful run.
KUMA_PUSH_URL=""

# Optional extra imapsync flags. Useful for testing: --justlogin, --dry
# EXTRA_ARGS=( --dry )
